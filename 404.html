<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mundo W Corp — Control de Activos</title>
    <script>
      // GitHub Pages no soporta rutas de SPA de forma nativa.
      // Este truco redirige cualquier ruta profunda hacia index.html
      // codificando la ruta original en la query string.
      var pathSegmentsToKeep = 1; // /mundo-w-inventario/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
